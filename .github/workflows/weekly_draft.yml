name: DB Strategy Weekly - Draft Only

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 0"   # Sunday 08:00 Qatar time

jobs:
  generate-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly draft
        env:
          DB_STRATEGY_WEEKLY_SUPABASE_URL: ${{ secrets.DB_STRATEGY_WEEKLY_SUPABASE_URL }}
          DB_STRATEGY_WEEKLY_SUPABASE_KEY: ${{ secrets.DB_STRATEGY_WEEKLY_SUPABASE_KEY }}
          DB_STRATEGY_WEEKLY_OPENAI_API_KEY: ${{ secrets.DB_STRATEGY_WEEKLY_OPENAI_API_KEY }}
          DB_STRATEGY_WEEKLY_RESEND_API_KEY: ${{ secrets.DB_STRATEGY_WEEKLY_RESEND_API_KEY }}
          DB_STRATEGY_WEEKLY_EMAIL_FROM: ${{ secrets.DB_STRATEGY_WEEKLY_EMAIL_FROM }}
          DB_STRATEGY_WEEKLY_APPROVER_EMAIL: ${{ secrets.DB_STRATEGY_WEEKLY_APPROVER_EMAIL }}
        run: |
          python generate_news_drafts.py
