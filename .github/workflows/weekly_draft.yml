name: DB Strategy Weekly - Draft Only

on:
  schedule:
    - cron: "0 3 * * 0" # Sunday 06:00 Qatar
  workflow_dispatch:

jobs:
  draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate 3 full draft articles from news + Supabase metrics
        env:
          SUPABASE_URL: ${{ secrets.DB_STRATEGY_WEEKLY_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DB_STRATEGY_WEEKLY_SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5
          APPROVAL_WEBHOOK_URL: ${{ secrets.APPROVAL_WEBHOOK_URL }}
        run: |
          python generate_news_drafts.py --out drafts.html --json-out drafts.json --bank "Doha Bank Q.P.S.C."

      - name: Confirm draft files exist
        run: |
          ls -la
          cat drafts.json

      - name: Email full draft articles to approver only
        env:
          DB_STRATEGY_WEEKLY_RESEND_API_KEY: ${{ secrets.DB_STRATEGY_WEEKLY_RESEND_API_KEY }}
          DB_STRATEGY_WEEKLY_EMAIL_FROM: ${{ secrets.DB_STRATEGY_WEEKLY_EMAIL_FROM }}
          DB_STRATEGY_WEEKLY_APPROVER_EMAIL: ${{ secrets.DB_STRATEGY_WEEKLY_APPROVER_EMAIL }}
          DB_STRATEGY_WEEKLY_FINAL_EMAIL_TO: ""
          DB_STRATEGY_WEEKLY_EMAIL_SUBJECT: Approval Required — DB Strategy Weekly
        run: |
          python send_email.py drafts.html

      - name: Upload draft artifacts
        uses: actions/upload-artifact@v4
        with:
          name: db-strategy-weekly-drafts
          path: |
            drafts.html
            drafts.json
            strategy_weekly_option_1.html
            strategy_weekly_option_2.html
            strategy_weekly_option_3.html
