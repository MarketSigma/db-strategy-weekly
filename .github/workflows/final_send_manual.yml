name: DB Strategy Weekly - Final Send Manual

on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: "Approved topic id"
        required: true
        default: "1"

permissions:
  contents: read
  actions: read
  
jobs:
  final-send:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest draft artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: weekly_draft.yml
          name: db-strategy-weekly-drafts
          path: .

      - name: Confirm approved article file exists
        run: |
          ls -la
          cat drafts.json
          test -f "strategy_weekly_option_${{ github.event.inputs.topic_id }}.html"
          cp "strategy_weekly_option_${{ github.event.inputs.topic_id }}.html" strategy_weekly_final.html

      - name: Send final article
        env:
          DB_STRATEGY_WEEKLY_RESEND_API_KEY: ${{ secrets.DB_STRATEGY_WEEKLY_RESEND_API_KEY }}
          DB_STRATEGY_WEEKLY_EMAIL_FROM: ${{ secrets.DB_STRATEGY_WEEKLY_EMAIL_FROM }}
          DB_STRATEGY_WEEKLY_FINAL_EMAIL_TO: ${{ secrets.DB_STRATEGY_WEEKLY_FINAL_EMAIL_TO }}
          DB_STRATEGY_WEEKLY_EMAIL_SUBJECT: DB Weekly Opportunities & Risks — ${{ github.run_started_at }}
        run: |
          python send_email.py strategy_weekly_final.html

    
